<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Generator</title>
</head>
<body>
<h1>Password Generator</h1>
<div>
  <label>Length</label>
  <input type="text">
</div>
<div>
  <label for="letters">Use Letters</label>
  <input type="checkbox" name="letters" id="letters" (change)="onChangeUseLetters()">
</div>
<div>
  <label for="symbols">Use Symbols</label>
  <input type="checkbox" name="symbols" id="symbols" (change)="onChangeUseSymbols()">
</div>
<div>
  <label for="numbers">Use Numbers</label>
  <input type="checkbox" name="numbers" id="numbers" (change)="onChangeUseNumbers()">
</div>
<div>
  <button type="submit" (click)="onButtonClick()">Generate !</button>
</div>
<div>
  <label for="password">Your Password</label>
  <input type="text" id="password" [value]="password">
</div>
{{password}}
</body>
</html>
