<div class="w-full max-w-lg rounded-3xl bg-white shadow-2xl border border-stone-200 p-8 m-auto">
  <h1 class="text-4xl font-bold text-center text-stone-800">Password Generator</h1>
  <p class="text-center text-stone-500 mt-2 mb-8">Generate secure random passwords in seconds</p>
  <!-- Length -->
  <div class="mb-5">
    <label for="length" class="block text-sm font-semibold text-stone-700 mb-2">
      Password Length
    </label>

    <input id="length" type="text" (input)="onChangeLength($any($event.target).value)"
      class="w-full rounded-xl border border-stone-300 bg-stone-50 px-4 py-3 outline-none transition focus:border-amber-500 focus:ring-4 focus:ring-amber-200" />
  </div>

  <!-- Checkboxes -->
  <div class="space-y-4 mb-8">
    <label
      class="flex items-center justify-between rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 cursor-pointer">
      <span class="font-medium text-stone-700"> Include Letters </span>

      <input type="checkbox" id="letters" (change)="onChangeUseLetters()" class="h-5 w-5 accent-amber-600" />
    </label>

    <label
      class="flex items-center justify-between rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 cursor-pointer">
      <span class="font-medium text-stone-700"> Include Symbols </span>

      <input type="checkbox" id="symbols" (change)="onChangeUseSymbols()" class="h-5 w-5 accent-amber-600" />
    </label>

    <label
      class="flex items-center justify-between rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 cursor-pointer">
      <span class="font-medium text-stone-700"> Include Numbers </span>

      <input type="checkbox" id="numbers" (change)="onChangeUseNumbers()" class="h-5 w-5 accent-amber-600" />
    </label>
  </div>

  <!-- Button -->
  <button (click)="onButtonClick()" [disabled]="!(length && (includeNumbers() || includeSymbols() || includeLetters()))"
    class="w-full rounded-xl bg-amber-600 py-3 text-lg font-semibold text-white transition hover:bg-amber-700 disabled:cursor-not-allowed disabled:bg-stone-300">
    Generate Password
  </button>

  <!-- Result -->
  <div class="mt-8">
    <label class="block text-sm font-semibold text-stone-700 mb-2"> Generated Password </label>

    <input type="text" [value]="password" readonly
      class="w-full rounded-xl border border-stone-300 bg-stone-100 px-4 py-3 font-mono text-center tracking-wider" />
  </div>
</div>
