<div>
  <h1>Password Generator</h1>
  <p>Generate secure random passwords in seconds</p>
  <!-- Length -->
  <div>
    <label for="length">
      Password Length
    </label>

    <input id="length" type="text" (input)="onChangeLength($any($event.target).value)"/>
  </div>

    <!-- Checkboxes -->
    <div>
      <label
      >
        <span> Include Letters </span>

        <input type="checkbox" id="letters" (change)="onChangeUseLetters()" />
      </label>

      <label
      >
        <span> Include Symbols </span>

        <input type="checkbox" id="symbols" (change)="onChangeUseSymbols()" />
      </label>

      <label
      >
        <span> Include Numbers </span>

        <input type="checkbox" id="numbers" (change)="onChangeUseNumbers()" />
      </label>
    </div>

    <!-- Button -->
    <button (click)="onButtonClick()"
            [disabled]="!(length && (includeNumbers() || includeSymbols() || includeLetters()))"
    >
      Generate Password
    </button>

    <!-- Result -->
    <div>
      <label> Generated Password </label>

      <input type="text" [value]="password" readonly
      />
    </div>
  </div>
